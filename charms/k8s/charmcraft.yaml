name: jaime-k8s
type: charm
title: Jaime k8s
summary: Jaime k8s - Juju AI Medic Engine for Kubernetes
description: |
  Jaime k8s is a Juju Kubernetes charm that monitors applications in the same
  model, collects bounded diagnostic context via kubectl, and writes structured
  incident reports. Optionally calls an AI provider for diagnosis suggestions.
links:
  contact:
    - ljupcho.vangelski@canonical.com
    - gaetan.gouzi@canonical.com
  documentation: https://github.com/canonical/jaime
  issues:
    - https://github.com/canonical/jaime/issues
  source:
    - https://github.com/canonical/jaime

version: "0.0.1"
base: ubuntu@24.04
platforms:
  ubuntu-24.04-amd64:
    build-on: [amd64]
    build-for: [amd64]

parts:
  charm:
    plugin: charm
    source: .
    override-build: |
      cp -r _jaime-package/jaime/. src/jaime/
      craftctl default
    override-prime: |
      craftctl default
      chmod +x $CRAFT_PRIME/dispatch
      chmod +x $CRAFT_PRIME/src/charm.py

analysis:
  ignore:
    linters:
      - entrypoint
